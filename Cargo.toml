[package]
name = "poly-box"
version = "0.1.0"
edition = "2021"
description = "A five-voice analog-style polysynth in the Box family, after the Oberheim SEM sound"
authors = ["Timster's Audio Works"]
publish = false

[workspace]
members = ["engine", "app", "xtask"]

[lib]
# cdylib for the plug-in bundles, lib for the offline renderer and tests.
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["vst3"] }
poly-box-engine = { path = "engine" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

